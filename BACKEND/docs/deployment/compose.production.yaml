# Learning and release example. Read README.md before use on a public server.
# This is a standalone file, not an override for the local compose.yaml.
name: taskflow-production

x-env: &env
  DATABASE_URL: postgresql+asyncpg://taskflow:${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD}@db:5432/taskflow
  REDIS_URL: redis://:${REDIS_PASSWORD:?Generate REDIS_PASSWORD}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET}
  ENVIRONMENT: production
  CORS_ORIGINS: '[]'
  EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
  EMAIL_FROM: ${EMAIL_FROM:-taskflow@example.com}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

x-app: &app
  image: ${APP_IMAGE:-taskflow-api:portfolio-v1}
  build:
    context: ../..
  environment: *env
  networks: [appnet]
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_DB: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U taskflow -d taskflow']
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --requirepass, '${REDIS_PASSWORD:?Generate REDIS_PASSWORD}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    profiles: [tools]
    command: [alembic, upgrade, head]
    restart: 'no'
  api:
    <<: *app
    command: [uvicorn, 'app.main:app', --host, '0.0.0.0', --port, '8000', --proxy-headers, --forwarded-allow-ips, '172.30.50.10']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: [celery, -A, 'app.workers.celery_app:celery_app', worker, --loglevel=info, --concurrency=2]
  beat:
    <<: *app
    command: [celery, -A, 'app.workers.celery_app:celery_app', beat, --loglevel=info, '--schedule=/tmp/taskflow-beat']
  frontend:
    image: ${WEB_IMAGE:-taskflow-web:portfolio-v1}
    build:
      context: ../../frontend
    volumes: ['./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro']
    networks:
      appnet:
        ipv4_address: 172.30.50.10
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://127.0.0.1:8080/']
      interval: 10s
      timeout: 3s
      retries: 20
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set a real DNS hostname}
      TLS_EMAIL: ${TLS_EMAIL:?Set a contact email}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [appnet]
    restart: unless-stopped
    depends_on:
      frontend: {condition: service_healthy}

networks:
  appnet:
    ipam:
      config: [{subnet: 172.30.50.0/24}]

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
